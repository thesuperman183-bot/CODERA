[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.2.0"
description = "CLI and API for memory-guided code reviews"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4.0",
    "keyring>=24.0",
]

[project.scripts]
codera = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools]
py-modules = ["cli", "main", "hindsight_service"]
