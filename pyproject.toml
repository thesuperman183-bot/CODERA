[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "CLI and API for memory-guided code reviews"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "pydantic>=1.10"]

[project.scripts]
review-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main", "hindsight_service"]
